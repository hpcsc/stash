<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add to a note — Stash</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header>
      <h1>Add to a note</h1>
      <p class="preview" id="preview"></p>
    </header>
    <main>
      <div class="status-line">
        <span class="status" id="status">Loading notes…</span>
      </div>
      <p class="error" id="error" hidden></p>
      <ul class="note-list" id="note-list"></ul>
      <p class="empty" id="empty" hidden>No notes yet. Capture a note first, then add selections to it.</p>
      <p class="expired" id="expired" hidden>This selection has expired. Select text and choose "Add selection to a note…" again.</p>
    </main>
    <footer>
      <button id="cancel">Cancel</button>
    </footer>
    <script type="module" src="picker.js"></script>
  </body>
</html>
