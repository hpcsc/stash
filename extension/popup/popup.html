<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stash</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <section id="home">
      <header><h1>Stash</h1></header>
      <main>
        <p class="status" id="status">Checking…</p>
        <p class="server" id="server"></p>
        <button id="sign-in" class="primary" hidden>Sign in with Google</button>
        <button id="sign-out" hidden>Sign out</button>
        <button id="settings">Settings</button>
      </main>
      <p class="hint">Right-click a page, a selection, or an image to save it to Stash.</p>
    </section>
    <section id="picker" hidden>
      <header class="picker-head">
        <button id="picker-back" class="back-btn">&larr; Back</button>
        <h1>Add to a note</h1>
      </header>
      <p class="picker-preview" id="picker-preview"></p>
      <div class="picker-loading" id="picker-loading">Loading notes…</div>
      <div class="picker-error" id="picker-error" hidden></div>
      <ul class="picker-list" id="picker-list"></ul>
      <p class="picker-empty" id="picker-empty" hidden>No existing notes.</p>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
