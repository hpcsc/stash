# Tests every push, then publishes the backend images and deploys them to the
# free-tier GCP VM from main. Nothing is built or pushed until the tests pass.
# The web image is built on the VM because it bakes the Google client ID in as a
# build arg.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mise install
        uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run shellcheck
        run: task test:shellcheck

      - name: Run Unit Test
        run: task test:unit

      - name: Run Integration Test
        run: task test:integration

      - name: Run vulnerabilities check
        run: task test:vulnerabilities

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - name: api
            dockerfile: server/Dockerfile.api
            context: server
          - name: catchup
            dockerfile: server/Dockerfile.catchup
            context: server
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}

  deploy:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Read outputs
        id: tf
        working-directory: terraform
        run: |
          {
            echo "ip=$(terraform output -raw instance_public_ip)"
            echo "db_host=$(terraform output -raw db_host)"
            echo "db_name=$(terraform output -raw db_name)"
            echo "db_user=$(terraform output -raw db_user)"
            echo "db_password=$(terraform output -raw db_password)"
            echo "r2_endpoint=$(terraform output -raw r2_endpoint)"
            echo "r2_bucket=$(terraform output -raw r2_bucket)"
            echo "ssh_key=$(terraform output -raw ssh_private_key)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare SSH and env
        run: |
          mkdir -p ~/.ssh
          echo "${{ steps.tf.outputs.ssh_key }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          {
            echo "Host stash-vm"
            echo "  HostName ${{ steps.tf.outputs.ip }}"
            echo "  User ubuntu"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
          } > ~/.ssh/config

          cat > /tmp/env.cloud <<ENV
          DB_HOST=${{ steps.tf.outputs.db_host }}
          DB_PORT=5432
          DB_NAME=${{ steps.tf.outputs.db_name }}
          DB_USERNAME=${{ steps.tf.outputs.db_user }}
          DB_PASSWORD=${{ steps.tf.outputs.db_password }}
          DB_SSLMODE=require
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          S3_BUCKET=${{ steps.tf.outputs.r2_bucket }}
          S3_REGION=auto
          S3_ENDPOINT=${{ steps.tf.outputs.r2_endpoint }}
          S3_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_PATH_STYLE=true
          ENV

          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > /tmp/ghcr-token

      - name: Deploy to VM
        run: |
          scp /tmp/env.cloud /tmp/ghcr-token stash-vm:/tmp/
          ssh stash-vm 'bash -s' <<'SCRIPT'
            set -euo pipefail

            # The startup script installs Docker on first boot. Wait for its marker
            # so the first deploy does not race the install.
            for _ in $(seq 1 120); do
              if [ -f /var/lib/stash-vm-ready ]; then break; fi
              sleep 5
            done
            if [ ! -f /var/lib/stash-vm-ready ]; then
              echo "VM bootstrap did not finish; check the serial console or /var/log/syslog" >&2
              exit 1
            fi

            if [ ! -d "$HOME/stash" ]; then
              git clone https://github.com/${{ github.repository }}.git "$HOME/stash"
            fi
            cd "$HOME/stash"
            git pull --ff-only
            cp /tmp/env.cloud server/.env.cloud

            docker login ghcr.io -u "${{ github.actor }}" --password-stdin < /tmp/ghcr-token
            rm -f /tmp/ghcr-token /tmp/env.cloud

            docker compose --env-file server/.env.cloud -f server/docker-compose.cloud.yml up -d --build --pull always
          SCRIPT
