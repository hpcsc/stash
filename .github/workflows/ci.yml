# Tests every push, then publishes the backend images and deploys them to the
# free-tier GCP VM from main. Nothing is built or pushed until the tests pass.
# The api image bundles the web app, which reads the Google client ID from the API at runtime.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mise install
        uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run shellcheck
        run: task test:shellcheck

      - name: Run Unit Test
        run: task test:unit

      - name: Run Integration Test
        run: task test:integration

      - name: Run vulnerabilities check
        run: task test:vulnerabilities

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - name: api
            dockerfile: server/Dockerfile.api
            context: .
          - name: catchup
            dockerfile: server/Dockerfile.catchup
            context: server
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}

  deploy:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=vars/production.tfvars -auto-approve -input=false

      - name: Read outputs
        id: tf
        working-directory: terraform
        run: |
          ip=$(terraform output -raw instance_public_ip)
          db_host=$(terraform output -raw db_host)
          db_name=$(terraform output -raw db_name)
          db_user=$(terraform output -raw db_user)
          db_password=$(terraform output -raw db_password)
          r2_endpoint=$(terraform output -raw r2_endpoint)
          r2_bucket=$(terraform output -raw r2_bucket)
          app_hostname=$(terraform output -raw app_hostname)

          {
            echo "ip=$ip"
            echo "db_host=$db_host"
            echo "db_name=$db_name"
            echo "db_user=$db_user"
            echo "db_password=$db_password"
            echo "r2_endpoint=$r2_endpoint"
            echo "r2_bucket=$r2_bucket"
            echo "app_hostname=$app_hostname"
          } >> "$GITHUB_OUTPUT"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          terraform output -raw ssh_private_key > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          terraform output -raw tunnel_token > /tmp/tunnel-token
          {
            echo "Host stash-vm"
            echo "  HostName $ip"
            echo "  User ubuntu"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
          } > ~/.ssh/config

          cat > /tmp/env.cloud <<ENV
          DB_HOST=$db_host
          DB_PORT=5432
          DB_NAME=$db_name
          DB_USERNAME=$db_user
          DB_PASSWORD=$db_password
          DB_SSLMODE=require
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EVENT_BROWSER_USER_IDS=${{ vars.EVENT_BROWSER_USER_IDS }}
          S3_BUCKET=$r2_bucket
          S3_REGION=auto
          S3_ENDPOINT=$r2_endpoint
          S3_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_PATH_STYLE=true
          ENV

          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > /tmp/ghcr-token

      - name: Deploy to VM
        run: |
          # Wait for SSH to be ready — the VM sometimes isn't reachable immediately.
          for _ in $(seq 1 12); do
            if ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null stash-vm echo ok 2>/dev/null; then
              break
            fi
            sleep 5
          done

          scp /tmp/env.cloud /tmp/ghcr-token /tmp/tunnel-token stash-vm:/tmp/
          ssh stash-vm 'bash -s' <<'SCRIPT'
            set -euo pipefail

            # The startup script installs Docker on first boot. Wait for its marker
            # so the first deploy does not race the install.
            for _ in $(seq 1 120); do
              if [ -f /var/lib/stash-vm-ready ]; then break; fi
              sleep 5
            done
            if [ ! -f /var/lib/stash-vm-ready ]; then
              echo "VM bootstrap did not finish; check the serial console or /var/log/syslog" >&2
              exit 1
            fi

            if [ ! -d "$HOME/stash" ]; then
              git clone https://github.com/${{ github.repository }}.git "$HOME/stash"
            fi
            cd "$HOME/stash"
            # The VM has no local work to keep; reset to the remote so a rewritten
            # (rebased/amended) history does not block the deploy.
            git fetch origin
            git reset --hard origin/main
            cp /tmp/env.cloud server/.env.cloud

            sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin < /tmp/ghcr-token
            rm -f /tmp/ghcr-token /tmp/env.cloud

            sudo docker compose --env-file server/.env.cloud -f server/docker-compose.cloud.yml up -d --pull always

            # cloudflared: use the named tunnel when a token is present, else the quick tunnel.
            if [ -s /tmp/tunnel-token ]; then
              sudo install -d -m 0755 /etc/cloudflared
              sudo bash -c 'umask 077; printf "TUNNEL_TOKEN=%s\n" "$(cat /tmp/tunnel-token)" > /etc/cloudflared/tunnel.env'
              sudo sh -c 'printf "%s" "" | base64 -d > /etc/systemd/system/cloudflared-stash.service'
            else
              sudo sh -c 'printf "%s" "" | base64 -d > /etc/systemd/system/cloudflared-stash.service'
            fi
            sudo rm -f /tmp/tunnel-token
            sudo systemctl daemon-reload
            sudo systemctl enable cloudflared-stash
            if ! sudo systemctl restart cloudflared-stash; then
              sudo journalctl -u cloudflared-stash -n 50 --no-pager || true
              exit 1
            fi

            # Quick tunnel only: print the ephemeral URL from the journal.
            if [ ! -s /etc/cloudflared/tunnel.env ]; then
              echo "Tunnel URL (waiting up to 15s)..."
              for _ in $(seq 1 15); do
                url="$(journalctl -u cloudflared-stash --no-pager -o cat -n 50 2>/dev/null \
                  | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1 || true)"
                if [ -n "$url" ]; then
                  echo "  ▶ $url"
                  break
                fi
                sleep 1
              done
            fi
          SCRIPT

          if [ -n "${{ steps.tf.outputs.app_hostname }}" ]; then
            echo "App: https://${{ steps.tf.outputs.app_hostname }}"
          fi
