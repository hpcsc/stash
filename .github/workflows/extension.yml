# Tests and packages the browser extension. A v* tag publishes the Chrome zip
# and, when AMO secrets are set, the signed Firefox XPI to a GitHub Release.
# A push to main publishes the same packages as a prerelease, so a change can
# be tried before it gets a stable tag. Release assets are the install channel:
# they are public, permanent, and versioned, unlike workflow artifacts that
# expire and require a login.
name: Extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: extension

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            prerelease=false
            if ! echo "$version" | grep -qE '^[0-9]+(\.[0-9]+){0,3}$'; then
              echo "::error::stable tags must be numeric, for example v1.2.3; pushes to main publish prereleases"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$GITHUB_RUN_NUMBER" -gt 65535 ]; then
              echo "::error::the run number no longer fits a browser version component (maximum 65535)"
              exit 1
            fi
            latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            IFS=. read -r major minor patch <<< "${latest:-v$(node -p "require('./package.json').version")}"
            major="${major#v}"
            # Four numeric parts so the browser orders 1.2.3.42 above stable 1.2.3
            # and below the next stable tag, 1.2.4.
            version="${major}.${minor}.${patch}.${GITHUB_RUN_NUMBER}"
            tag="v${major}.${minor}.$((patch + 1))-${GITHUB_RUN_NUMBER}.g$(git rev-parse --short=7 HEAD)"
            prerelease=true
          else
            version="$(node -p "require('./package.json').version")"
            tag=""
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: npm run build -- --version "${{ steps.version.outputs.version }}"

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Sign Firefox package
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: npm run sign:firefox

      - name: Collect release files
        run: |
          mkdir -p release
          cp "dist/stash-chrome-${{ steps.version.outputs.version }}.zip" release/
          xpi="$(find dist/signed -name '*.xpi' -print -quit 2>/dev/null || true)"
          if [ -n "$xpi" ]; then
            cp "$xpi" "release/stash-firefox-${{ steps.version.outputs.version }}.xpi"
          else
            echo "::notice::Firefox signing skipped. Set AMO_API_KEY and AMO_API_SECRET to attach a signed XPI."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: extension/release/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-${{ needs.package.outputs.version }}
          path: release

      - name: Publish release assets
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

  prerelease:
    needs: package
    if: needs.package.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Prerelease tags carry the run number and the prune deletes older
    # releases, so two pushes to main must not interleave.
    concurrency:
      group: extension-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-${{ needs.package.outputs.version }}
          path: release

      # gh release create makes the tag at this commit, so a failed build
      # leaves no tag behind.
      - name: Publish prerelease assets
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --prerelease
          gh release upload "$TAG" release/* --clobber

      - name: Keep the 5 newest prereleases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+\\.g[0-9a-f]+$")))]
                  | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
