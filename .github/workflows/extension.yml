# Tests and packages the browser extension. A v* tag publishes the Chrome zip
# and, when AMO secrets are set, the signed Firefox XPI to a GitHub Release.
# Release assets are the install channel: they are public, permanent, and
# versioned, unlike workflow artifacts that expire and require a login.
name: Extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: extension

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: npm run build -- --version "${{ steps.version.outputs.version }}"

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Sign Firefox package
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: npm run sign:firefox

      - name: Collect release files
        run: |
          mkdir -p release
          cp "dist/stash-chrome-${{ steps.version.outputs.version }}.zip" release/
          xpi="$(find dist/signed -name '*.xpi' -print -quit 2>/dev/null || true)"
          if [ -n "$xpi" ]; then
            cp "$xpi" "release/stash-firefox-${{ steps.version.outputs.version }}.xpi"
          else
            echo "::notice::Firefox signing skipped. Set AMO_API_KEY and AMO_API_SECRET to attach a signed XPI."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: extension/release/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-${{ needs.package.outputs.version }}
          path: release

      - name: Publish release assets
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
