version: '3'

includes:
  migrate:
    taskfile: server/Taskfile.migrate.yml
    dir: server
  test:
    taskfile: server/Taskfile.test.yml
    dir: server
  api:
    taskfile: server/Taskfile.api.yml
    dir: server
  catchup:
    taskfile: server/Taskfile.catchup.yml
    dir: server
  web:
    taskfile: web/Taskfile.yml
    dir: web
  extension:
    taskfile: extension/Taskfile.yml
    dir: extension

tasks:
  test:shellcheck:
    cmds:
      - find ./server/scripts -type f -name '*.sh' | xargs shellcheck -S error
      - shellcheck -S error ./hooks/*
      - shellcheck -S error ./scripts/*.sh

  hook:setup:
    cmds:
      - git config core.hooksPath ./hooks

  hook:validate-go-changes:
    cmds:
      - task: test:all

  db:cli:
    dir: server
    dotenv:
      - .env.local
    cmds:
      - docker compose -p stash-local exec db psql -U${DB_USERNAME} -d${DB_NAME}

  db:query:
    desc: example `task db:query -- 'select * from events'`
    silent: true
    dir: server
    dotenv:
      - .env.local
    cmds:
      - docker compose -p stash-local exec db psql -U${DB_USERNAME} -d${DB_NAME} -c {{.CLI_ARGS}}

  run-dependencies:
    dir: server
    cmds:
      - docker compose --env-file .env.local -f docker-compose.dependencies.yml -p stash-local up -d --wait db
      - docker compose --env-file .env.local -f docker-compose.dependencies.yml -p stash-local up --exit-code-from migrate migrate
      - command -v tmuxp && echo "tmuxp exists" || pip install tmuxp

  remove-dependencies:
    dir: server
    cmds:
      - docker compose --env-file .env.local -f docker-compose.dependencies.yml -p stash-local down

  run:
    deps: [run-dependencies]
    cmds:
      - tmuxp load -a server/.tmuxp.yaml
