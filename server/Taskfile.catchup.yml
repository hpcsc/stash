version: '3'

tasks:
  run:
    dotenv:
      - .env.local
    cmds:
      - go run ./cmd/catchup

  build:
    cmds:
      - mkdir -p ./bin
      - go build --ldflags "-extldflags -static" -o ./bin/catchup ./cmd/catchup
    env:
      CGO_ENABLED: '0'

  docker:build:
    cmds:
      - |
        docker build \
          -t stash-catchup:{{ default "latest" .TAG }} \
          -f Dockerfile.catchup \
          .
