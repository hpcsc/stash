version: '3'

tasks:
  run:
    dotenv:
      - .env.local
    cmds:
      - go run ./cmd/api

  build:
    cmds:
      - mkdir -p ./bin
      - go build --ldflags "-extldflags -static -X 'github.com/hpcsc/stash/internal/api/use_cases/root.Version=${VERSION}'" -o ./bin/api ./cmd/api
    env:
      CGO_ENABLED: '0'
      VERSION: ${VERSION:-main}

  docker:build:
    cmds:
      - |
        docker build \
          -t stash-api:{{ default "latest" .TAG }} \
          -f Dockerfile.api \
          --build-arg=VERSION=$(git rev-parse HEAD 2>/dev/null || echo main) \
          ..
