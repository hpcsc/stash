version: '3'

tasks:
  run:
    desc: run the web app on port 8080
    cmds:
      - npm run dev -- --port 8080

  build:
    desc: build the web app for production
    cmds:
      - npm run build

  event-browser:build:
    desc: build only the event browser page
    cmds:
      - npm run build:event-browser

  event-browser:dev:
    desc: run the event browser page against a local event browser CLI on 7777
    cmds:
      - npm run dev:event-browser

  check:
    desc: type-check the web app
    cmds:
      - npm run check

  test:
    desc: run the web app tests
    cmds:
      - npm test
