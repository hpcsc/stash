version: '3'

tasks:
  run:
    cmds:
      - go run ./cmd/api
    env:
      SESSION_SECRET: local-dev-secret
      GOOGLE_CLIENT_ID: local-dev-client-id
      DB_HOST: localhost
      DB_NAME: events
      DB_USERNAME: local-user
      DB_PASSWORD: local-password
      DB_HOST_PORT: 45432

  build:
    cmds:
      - mkdir -p ./bin
      - go build --ldflags "-extldflags -static -X 'github.com/hpcsc/stash/internal/api/use_cases/root.Version=${VERSION}'" -o ./bin/api ./cmd/api
    env:
      CGO_ENABLED: '0'
      VERSION: ${VERSION:-main}

  docker:build:
    cmds:
      - |
        docker build \
          -t stash-api:{{ default "latest" .TAG }} \
          -f Dockerfile.api \
          --build-arg=VERSION=$(git rev-parse HEAD 2>/dev/null || echo main) \
          .
